name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # --ignore-scripts skips native builds (better-sqlite3) and the geoip-lite
      # postinstall. CI builds (tsc/esbuild) and the test suites do not need them.
      - name: Install
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Build all packages
        run: npm run build --workspaces --if-present

      - name: Test all packages
        run: npm test --workspaces --if-present

      - name: End-to-end integration proof
        run: node test/integration.mjs

      - name: WASM example (prebuilt binary)
        run: node examples/wasm-logic/test.mjs

      - name: Full-stack e2e (all layers together)
        run: node examples/full-stack/test.mjs

  # The collector's native SQLite driver must build and load on every supported
  # Node version, and every admin route must require the token. The main job
  # skips install scripts, so neither is covered there.
  collector-http:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Build the native SQLite driver
        run: npm rebuild better-sqlite3
      - name: Build the collector and its dependencies
        run: npm run build -w packages/adaptive -w packages/watermark -w packages/collector
      - name: HTTP tests against a running collector
        run: npm run test:http -w packages/collector

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Format check
        run: npm run format:check
