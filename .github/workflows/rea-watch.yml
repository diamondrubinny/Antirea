name: REA upstream watch

# Hourly: if REA published a release newer than the one our signatures were
# verified against, open ONE issue and assign Copilot to update them.
# Defensive housekeeping only — it reads public npm metadata and never runs REA.
#
# Assigning Copilot needs a user token. Add a repository secret named
# COPILOT_ASSIGN_TOKEN: a fine-grained PAT with metadata read, and read/write
# on actions, contents, issues, and pull requests (classic PAT: repo scope).
# The workflow GITHUB_TOKEN cannot assign Copilot. Scheduled runs use the
# default branch only, and GitHub may delay public-repo schedules.

on:
  schedule:
    - cron: "17 * * * *" # hourly, off the top of the hour
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rea-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: rea
        run: node scripts/check-rea-version.mjs
      - name: Open a signature-update issue and assign Copilot
        if: steps.rea.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COPILOT_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          VERIFIED: ${{ steps.rea.outputs.verified }}
          LATEST: ${{ steps.rea.outputs.latest }}
        run: node scripts/open-rea-signature-task.mjs
